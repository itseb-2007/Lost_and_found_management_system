{% extends "base.html" %}

{% block title %}Admin Portal · CampusFind{% endblock %}

{% block body %}
<div class="auth-page-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo" style="background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);">
        <i class="fa-solid fa-shield-halved text-warning"></i>
      </div>
      <h3 class="auth-title">Staff Administration</h3>
      <p class="auth-subtitle">Campus security, facility staff &amp; lost property management.</p>
    </div>

    <!-- Default Admin Notice -->
    <div class="alert alert-light border small text-muted py-2 px-3 mb-4 rounded-3 text-center">
      <i class="fa-solid fa-shield-halved text-primary me-1"></i> Default Administrator: <strong>admin@college.edu</strong>
    </div>

    <form method="post" action="{{ url_for('admin_login') }}">
      <div class="auth-form-group">
        <label class="form-label">Administrator Email</label>
        <div class="input-with-icon">
          <i class="fa-solid fa-envelope"></i>
          <input class="form-control" type="email" name="email" value="admin@college.edu" placeholder="admin@college.edu" required autofocus>
        </div>
      </div>

      <div class="auth-form-group">
        <label class="form-label">Admin Security Password</label>
        <div class="input-with-icon">
          <i class="fa-solid fa-lock"></i>
          <input class="form-control" type="password" name="password" placeholder="••••••••" required>
        </div>
      </div>

      <button type="submit" class="btn btn-brand w-100 py-2 mt-3" style="background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);">
        <i class="fa-solid fa-lock-open me-1"></i> Authenticate as Administrator
      </button>
    </form>

    <div class="text-center mt-4 pt-3 border-top">
      <p class="small text-muted mb-0">
        Looking for student portal? <a href="{{ url_for('login') }}" class="fw-semibold">Student Sign In</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
