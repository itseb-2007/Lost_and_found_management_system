<div class="col-md-6 col-xl-4"><div class="cardx p-0 h-100">
{% if i.image %}<img class="itemimg" src="{{ url_for('static', filename='uploads/'+i.image) }}" alt="{{ i.name }}">{% else %}<div class="ph"><i class="fa-regular fa-image"></i></div>{% endif %}
<div class="p-3"><div class="d-flex justify-content-between"><span class="badge text-bg-{{ 'danger' if i.type=='lost' else 'success' }}">{{ i.type|capitalize }}</span><span class="small text-muted">{{ i.case_id }}</span></div>
<h6 class="mt-2 mb-1">{{ i.name }}</h6><div class="small text-muted">{{ i.category }} · {{ i.location }} · {{ i.date }}</div>
<div class="d-flex justify-content-between align-items-center mt-3"><span class="badge text-bg-{{ i.status|badge }}">{{ i.status }}</span>
<a class="btn btn-sm btn-outline-secondary" href="{{ url_for('item', iid=i.id) }}">View details</a></div></div></div></div>
