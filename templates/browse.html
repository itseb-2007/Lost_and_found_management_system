{% extends "base.html" %}{% block body %}<h3 class="fw-bold">Campus Item Directory</h3><p class="text-muted">Search reported belongings and find possible matches.</p>
<form class="cardx mb-4"><div class="row g-2"><div class="col-lg-4"><input class="form-control" name="q" placeholder="Search name, colour, description or case ID" value="{{ a.q or '' }}"></div>
<div class="col-6 col-lg-2"><select class="form-select" name="type"><option value="">Lost &amp; Found</option><option value="lost" {{ 'selected' if a.type=='lost' }}>Lost</option><option value="found" {{ 'selected' if a.type=='found' }}>Found</option></select></div>
<div class="col-6 col-lg-2"><select class="form-select" name="category"><option value="">All categories</option>{% for c in cats %}<option {{ 'selected' if a.category==c }}>{{ c }}</option>{% endfor %}</select></div>
<div class="col-6 col-lg-2"><select class="form-select" name="location"><option value="">All locations</option>{% for c in locs %}<option {{ 'selected' if a.location==c }}>{{ c }}</option>{% endfor %}</select></div>
<div class="col-6 col-lg-2 d-flex gap-2"><button class="btn btn-brand flex-fill">Apply</button><a class="btn btn-outline-secondary" href="{{ url_for('browse') }}">Clear</a></div></div></form>
<p class="text-muted small">{{ items|length }} result(s)</p>
<div class="row g-3">{% for i in items %}{% include "_card.html" %}{% else %}<div class="cardx text-center text-muted">No items match your filters.</div>{% endfor %}</div>{% endblock %}
